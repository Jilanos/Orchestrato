[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestrato"
version = "0.1.0.dev0"
description = "Local conversational supervisor for specialized coding agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jilanos", email = "paul.mondou@live.fr" }]
dependencies = []

[project.optional-dependencies]
console = ["rich>=13.7"]
dev = ["pytest>=8"]

[project.scripts]
orchestrato = "orchestrato.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
